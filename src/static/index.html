<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="auth-controls">
        <button id="user-menu-button" type="button" aria-label="User menu" aria-expanded="false">
          &#128100;
        </button>
        <div id="user-menu" class="user-menu hidden">
          <span id="teacher-status" class="hidden"></span>
          <button id="login-button" type="button">Teacher Login</button>
          <button id="logout-button" type="button" class="hidden">Sign Out</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-controls">
          <div class="form-group search-control">
            <label for="activity-search">Search activities:</label>
            <input
              type="search"
              id="activity-search"
              placeholder="Search by name, category, description, or schedule"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="category-filter">Category:</label>
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="activity-sort">Sort by:</label>
            <select id="activity-sort">
              <option value="schedule">Schedule (earliest first)</option>
              <option value="name">Name (A–Z)</option>
              <option value="name-desc">Name (Z–A)</option>
              <option value="schedule-desc">Schedule (latest first)</option>
            </select>
          </div>
        </div>
        <p id="activities-count" class="activities-count" aria-live="polite"></p>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog">
      <form id="login-form">
        <h3>Teacher Login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <div id="login-message" class="hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="submit">Log In</button>
          <button id="cancel-login" type="button" class="secondary-button">Cancel</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
